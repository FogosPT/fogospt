# Optional override: run the CI-built image instead of bind-mounting the code.
#
#   docker compose -f docker-compose.yml -f docker-compose.image.yml pull fogospt
#   docker compose -f docker-compose.yml -f docker-compose.image.yml up -d
#
# Deploy becomes `pull + up -d`; rollback is pinning FOGOSPT_IMAGE_TAG to a
# previous commit SHA. Only storage/ (logs, OG cache) and .env stay on the host.
services:
  fogospt:
    image: ghcr.io/fogospt/fogospt:${FOGOSPT_IMAGE_TAG:-latest}
    volumes: !override
      - ./fogospt/.env:/var/www/html/.env:ro
      - ./fogospt/storage:/var/www/html/storage
      - ./secrets/firebase-sa.json:/run/secrets/firebase-sa.json:ro
