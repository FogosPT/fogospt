name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP tests + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fogospt
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('fogospt/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php vendor/bin/phpunit
      - name: Security advisories
        run: composer audit --locked

  frontend:
    name: CSS build + JS syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fogospt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fogospt/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint:js
      - run: npm run build
      - name: Committed public/css/app.css is up to date
        run: git diff --exit-code -- public/css/app.css || (echo "::error::Run 'npm run build' and commit public/css/app.css" && exit 1)

  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    needs: [php, frontend]
    defaults:
      run:
        working-directory: fogospt
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fogospt/package-lock.json
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - name: Start app
        env:
          APP_ENV: local
          CACHE_DRIVER: array
          LOG_CHANNEL: stderr
          FIREBASE_APP_ID: '1:726949968874:web:0000000000000000000000'
        run: |
          export APP_KEY="base64:$(openssl rand -base64 32)"
          php artisan serve --host=127.0.0.1 --port=8091 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8091/pt/sobre >/dev/null && break; sleep 1; done
      - run: npm run test:smoke
        env:
          SMOKE_URL: http://127.0.0.1:8091
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: fogospt/test-results/smoke

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [php, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/fogospt/fogospt:latest
            ghcr.io/fogospt/fogospt:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: og-renderer builds
        run: docker build assets/og-renderer
